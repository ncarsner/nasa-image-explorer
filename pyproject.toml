[project]
name = "nasa-image-explorer"
version = "0.1.0"
description = "Search NASA's public image library from a NiceGUI front end served by FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "nicegui>=3.16",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.uv]
# The app runs from the checkout; there is nothing to build or install.
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "DTZ",  # naive datetimes
    "RUF",  # ruff's own rules
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
